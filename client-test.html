<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Test upload et analyse RoadGuard</title>
    <style>
      :root {
        color-scheme: light;
        font-family: system-ui, sans-serif;
        background: #f4f6f8;
        color: #17212b;
      }

      body {
        box-sizing: border-box;
        max-width: 760px;
        margin: 40px auto;
        padding: 0 20px;
      }

      main {
        padding: 28px;
        border: 1px solid #d8dee5;
        border-radius: 12px;
        background: white;
        box-shadow: 0 8px 28px #17212b12;
      }

      h1 {
        margin-top: 0;
      }

      label {
        display: block;
        margin: 18px 0 6px;
        font-weight: 650;
      }

      input[type="url"],
      input[type="file"] {
        box-sizing: border-box;
        width: 100%;
        padding: 10px;
        border: 1px solid #aab5c0;
        border-radius: 6px;
      }

      button {
        margin-top: 20px;
        padding: 11px 18px;
        border: 0;
        border-radius: 6px;
        background: #155eef;
        color: white;
        font: inherit;
        font-weight: 650;
        cursor: pointer;
      }

      button:disabled {
        opacity: 0.6;
        cursor: wait;
      }

      #status {
        min-height: 1.5em;
        margin-top: 20px;
        font-weight: 650;
      }

      #status[data-state="error"] {
        color: #b42318;
      }

      #status[data-state="success"] {
        color: #067647;
      }

      pre {
        overflow: auto;
        max-height: 480px;
        padding: 16px;
        border-radius: 6px;
        background: #101828;
        color: #f2f4f7;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }

      .hint {
        color: #475467;
        font-size: 0.92rem;
      }

      fieldset {
        margin: 18px 0 0;
        padding: 12px 16px;
        border: 1px solid #aab5c0;
        border-radius: 6px;
      }

      legend {
        font-weight: 650;
      }

      fieldset label {
        display: inline-flex;
        gap: 6px;
        margin: 0 18px 0 0;
        font-weight: 500;
      }

      #cards {
        margin-top: 24px;
      }

      .card {
        margin-top: 16px;
        padding: 16px;
        border: 1px solid #d8dee5;
        border-radius: 10px;
      }

      .card-header {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        align-items: flex-start;
      }

      .card-title {
        margin: 0;
        font-size: 1.02rem;
      }

      .card-badge {
        flex-shrink: 0;
        padding: 3px 10px;
        border-radius: 999px;
        background: #eef1f5;
        color: #475467;
        font-size: 0.78rem;
        font-weight: 650;
      }

      .option {
        margin-top: 10px;
        padding: 8px 10px;
        border: 1px solid #e4e7ec;
        border-radius: 8px;
      }

      .option.selected {
        border-color: #155eef;
        background: #f0f4ff;
        box-shadow: inset 0 0 0 1px #155eef;
      }

      .option-head {
        display: flex;
        justify-content: space-between;
        font-weight: 650;
      }

      .bar {
        margin-top: 6px;
        height: 8px;
        border-radius: 999px;
        background: #eef1f5;
        overflow: hidden;
      }

      .bar > span {
        display: block;
        height: 100%;
        background: #155eef;
      }

      .excerpt {
        margin: 12px 0 0;
        padding: 10px;
        border-radius: 8px;
        background: #f9fafb;
        font-size: 0.9rem;
      }

      .scene {
        margin-top: 24px;
        padding: 14px;
        border-radius: 8px;
        background: #f0f4ff;
      }

      details {
        margin-top: 20px;
      }

      summary {
        cursor: pointer;
        font-weight: 650;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Tester l’upload et l’analyse</h1>
      <p>
        Sélectionnez une image ou une vidéo. Le fichier est envoyé directement
        vers S3, puis analysé par l’API.
      </p>

      <form id="upload-form">
        <label for="api-url">URL de l’API</label>
        <input
          id="api-url"
          name="api-url"
          type="url"
          value="https://h2ibigr6ae.execute-api.us-east-1.amazonaws.com"
          required
        >

        <fieldset>
          <legend>Mode d’analyse</legend>
          <label>
            <input type="radio" name="mode" value="exam" checked>
            Examen
          </label>
          <label>
            <input type="radio" name="mode" value="situation">
            Conduite
          </label>
        </fieldset>

        <label for="media-file">Image ou vidéo</label>
        <input
          id="media-file"
          name="media-file"
          type="file"
          accept="image/jpeg,image/png,image/gif,image/webp,video/mp4,video/mpeg,video/quicktime,video/webm,video/x-matroska"
          required
        >
        <p class="hint">
          Images : 4 Mio maximum. Vidéos : 100 Mio maximum. Types acceptés :
          JPEG, PNG, GIF, WebP, MP4, MPEG, MOV, WebM et MKV.
        </p>

        <button id="submit-button" type="submit">Téléverser et analyser</button>
      </form>

      <div id="status" role="status" aria-live="polite"></div>

      <section id="scene" class="scene" hidden></section>
      <div id="cards"></div>
      <details id="debug-wrap" hidden>
        <summary>Détails techniques (debug)</summary>
        <pre id="debug"></pre>
      </details>
      <pre id="result" hidden></pre>
    </main>

    <script>
      const supportedTypes = new Set([
        "image/jpeg",
        "image/png",
        "image/gif",
        "image/webp",
        "video/mp4",
        "video/mpeg",
        "video/quicktime",
        "video/webm",
        "video/x-matroska",
      ]);
      const maxImageBytes = 4 * 1024 * 1024;
      const maxUploadBytes = 100 * 1024 * 1024;
      const form = document.querySelector("#upload-form");
      const fileInput = document.querySelector("#media-file");
      const apiUrlInput = document.querySelector("#api-url");
      const submitButton = document.querySelector("#submit-button");
      const statusElement = document.querySelector("#status");
      const resultElement = document.querySelector("#result");
      const sceneElement = document.querySelector("#scene");
      const cardsElement = document.querySelector("#cards");
      const debugWrap = document.querySelector("#debug-wrap");
      const debugElement = document.querySelector("#debug");

      function setStatus(message, state = "") {
        statusElement.textContent = message;
        statusElement.dataset.state = state;
      }

      function clearResults() {
        sceneElement.hidden = true;
        sceneElement.textContent = "";
        cardsElement.textContent = "";
        debugWrap.hidden = true;
        debugElement.textContent = "";
        resultElement.hidden = true;
        resultElement.textContent = "";
      }

      function renderCard(card, kbExcerpt) {
        const article = document.createElement("article");
        article.className = "card";

        const header = document.createElement("div");
        header.className = "card-header";
        const title = document.createElement("h3");
        title.className = "card-title";
        title.textContent = card.title || "";
        const badge = document.createElement("span");
        badge.className = "card-badge";
        badge.textContent = card.kind === "allow_deny" ? "Intention" : "Question";
        header.append(title, badge);
        article.append(header);

        for (const option of card.options || []) {
          const pct = Math.round((option.score || 0) * 100);
          const wrap = document.createElement("div");
          wrap.className = option.selected ? "option selected" : "option";
          const head = document.createElement("div");
          head.className = "option-head";
          const label = document.createElement("span");
          label.textContent = option.label;
          const score = document.createElement("span");
          score.textContent = `${pct}%`;
          head.append(label, score);
          const bar = document.createElement("div");
          bar.className = "bar";
          bar.setAttribute("role", "img");
          bar.setAttribute("aria-label", `${option.label} : ${pct}%`);
          const fill = document.createElement("span");
          fill.style.width = `${pct}%`;
          bar.append(fill);
          wrap.append(head, bar);
          article.append(wrap);
        }

        if (kbExcerpt) {
          const excerpt = document.createElement("p");
          excerpt.className = "excerpt";
          excerpt.textContent = `Référence Code de la route : ${kbExcerpt}`;
          article.append(excerpt);
        }

        cardsElement.append(article);
      }

      function renderAnalysis(analysis) {
        const sceneSummary = analysis.scene_summary || "";
        if (sceneSummary) {
          sceneElement.textContent = sceneSummary;
          sceneElement.hidden = false;
        }

        const references =
          (analysis.debug && analysis.debug.knowledge_references) || [];
        const cards = analysis.cards || [];
        cards.forEach((card, index) => {
          const kbExcerpt =
            analysis.mode === "situation" && references[index]
              ? references[index].text
              : undefined;
          renderCard(card, kbExcerpt);
        });

        if (analysis.debug) {
          debugElement.textContent = JSON.stringify(analysis.debug, null, 2);
          debugWrap.hidden = false;
        }
      }

      async function readJsonResponse(response, operation) {
        const text = await response.text();
        let payload;
        try {
          payload = text ? JSON.parse(text) : {};
        } catch {
          const error = new Error(
            `Réponse JSON invalide (HTTP ${response.status}).`
          );
          error.operation = operation;
          error.status = response.status;
          error.responseBody = text;
          throw error;
        }
        if (!response.ok) {
          const error = new Error(
            payload.error || `Erreur HTTP ${response.status}.`
          );
          error.operation = operation;
          error.status = response.status;
          error.payload = payload;
          throw error;
        }
        return payload;
      }

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        clearResults();

        const mode =
          form.querySelector('input[name="mode"]:checked')?.value || "exam";
        const file = fileInput.files[0];
        if (!file) {
          setStatus("Sélectionnez un fichier.", "error");
          return;
        }
        if (!supportedTypes.has(file.type)) {
          setStatus(`Type de fichier non pris en charge : ${file.type || "inconnu"}.`, "error");
          return;
        }
        const fileLimit = file.type.startsWith("image/")
          ? maxImageBytes
          : maxUploadBytes;
        if (file.size > fileLimit) {
          setStatus(
            file.type.startsWith("image/")
              ? "Cette image dépasse la limite d’analyse de 4 Mio."
              : "Cette vidéo dépasse la limite de téléversement de 100 Mio.",
            "error"
          );
          return;
        }

        const apiUrl = apiUrlInput.value.trim().replace(/\/+$/, "");
        submitButton.disabled = true;

        try {
          setStatus("Étape 1/3 : demande d’autorisation à l’API…");
          const uploadInfoResponse = await fetch(`${apiUrl}/uploads`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ content_type: file.type }),
          });
          const uploadInfo = await readJsonResponse(
            uploadInfoResponse,
            "Demande d’autorisation"
          );
          if (!uploadInfo.upload_url || !uploadInfo.fields || !uploadInfo.s3_key) {
            throw new Error("La réponse de /uploads est incomplète.");
          }

          setStatus("Étape 2/3 : envoi direct du fichier vers S3…");
          const uploadForm = new FormData();
          for (const [key, value] of Object.entries(uploadInfo.fields)) {
            uploadForm.append(key, value);
          }
          uploadForm.append("file", file);
          const s3Response = await fetch(uploadInfo.upload_url, {
            method: "POST",
            body: uploadForm,
          });
          if (!s3Response.ok) {
            const details = await s3Response.text();
            const error = new Error(
              `Échec HTTP ${s3Response.status}. ${details}`
            );
            error.operation = "Téléversement S3";
            error.status = s3Response.status;
            error.responseBody = details;
            throw error;
          }

          setStatus("Étape 3/3 : analyse du fichier…");
          const analysisResponse = await fetch(`${apiUrl}/query`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              mode,
              content_type: uploadInfo.content_type,
              s3_key: uploadInfo.s3_key,
            }),
          });
          const analysis = await readJsonResponse(analysisResponse, "Analyse");
          renderAnalysis(analysis);
          setStatus("Téléversement et analyse terminés.", "success");
        } catch (error) {
          const message = error instanceof Error ? error.message : String(error);
          const requestId = error?.payload?.request_id;
          const status = error?.status ? ` (HTTP ${error.status})` : "";
          const requestReference = requestId
            ? ` Référence à communiquer : ${requestId}.`
            : "";
          const networkHint =
            error instanceof TypeError
              ? " Vérifiez votre connexion et la configuration CORS de l’API/S3."
              : "";

          setStatus(
            `${error?.operation ? `${error.operation} : ` : ""}${message}${status}${requestReference}${networkHint}`,
            "error"
          );
          resultElement.textContent = JSON.stringify(
            error?.payload || {
              operation: error?.operation || "Client",
              status: error?.status || null,
              error: message,
              response_body: error?.responseBody || undefined,
            },
            null,
            2
          );
          resultElement.hidden = false;
        } finally {
          submitButton.disabled = false;
        }
      });
    </script>
  </body>
</html>
